# Xiaomi BE7000 (non-ES) - dry-run configuration verification
name: IPQ95XX-TEST

on:
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动追加插件配置；多个配置用换行分隔'
        required: false
        type: string
      TEST:
        description: '仅验证并发布配置文件，不编译固件'
        default: true
        required: true
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  config:
    name: Xiaomi BE7000 (non-ES) test
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: IPQ95XX
      WRT_THEME: vantage
      WRT_NAME: OWRT
      WRT_SSID: OWRT
      WRT_WORD: 12345678
      WRT_IP: 192.168.10.1
      WRT_PW: 无
      WRT_REPO: https://github.com/VIKINGYFY/immortalwrt.git
      WRT_BRANCH: owrt
      WRT_SOURCE: VIKINGYFY/immortalwrt
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      WRT_TEST: ${{inputs.TEST}}
